apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-art
  namespace: pixel-art
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: pixel-art.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pixel-art
                port:
                  number: 80
